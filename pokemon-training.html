    <head>

        <title>Pokemon Training Camp</title>
        <link rel="stylesheet" href="pokemon-training.css">
        <script src="pokemone-training.js"></script>
    </head>
    <body>
        <h1>Train Your Pokemon Here</h1>

        <p><strong>Instructions: </strong> Set your Pokemon's starting and target levels, then click "Start Training"</p>
        <div class="inputs">
            <p>
                Starting Level: <input type="number" id="starting-level" value="5" min="1" max="99">
                target Level: <input type="number" id="starting-level" value="5" min="2" max="100">
            </p>
        </div>

        <button onclick="startTraining()">Start Training!</button>

        <div id="output">Enter levels and click "Start Training" to level them up!</div>

        
    </body>
</html>
